services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: geoai-outdoor-assistant:latest
    container_name: geoai-api
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      # Everything has a working default; override only what you need.
      LOG_LEVEL: INFO
      SLM_N_THREADS: "4"
      MAX_IN_FLIGHT: "4"
      # Optional. Without it the air quality comes from the forecast grid and
      # the answer says so.
      WAQI_TOKEN: "${WAQI_TOKEN:-}"
      CONTACT_EMAIL: "${CONTACT_EMAIL:-}"
    volumes:
      # The response cache survives a restart, so a question that was already
      # answered is instant.
      - geoai-cache:/app/.cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7860/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    # The model is 1.1 GB and the process needs room for it.
    deploy:
      resources:
        limits:
          memory: 3G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  geoai-cache:
