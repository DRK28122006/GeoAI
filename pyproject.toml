[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoai-outdoor-assistant"
version = "0.1.0"
description = "Backend for GeoAI Outdoor Assistant"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic>=2.0",
    "pydantic-settings",
    "diskcache",
    "PyYAML",
    "astral",
    "llama-cpp-python==0.3.19",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
    "huggingface-hub[cli]",
]

[tool.setuptools]
packages = ["app", "app.sources"]

[tool.setuptools.package-data]
# The activity, profile, hazard and weight files are part of the package:
# without them an installed copy cannot start.
app = ["configs/*.yaml"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Test fixtures are tiny local classes with simple class level attributes.
"tests/*" = ["RUF012"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
