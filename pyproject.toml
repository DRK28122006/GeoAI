[project]
name = "geoai-outdoor-assistant"
version = "0.1.0"
description = "Backend for GeoAI Outdoor Assistant"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic>=2.0",
    "pydantic-settings",
    "diskcache",
    "PyYAML",
    "astral",
    "llama-cpp-python==0.3.19",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
]

[tool.setuptools]
packages = ["app", "app.sources"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
