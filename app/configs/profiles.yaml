# Personal profiles. Each profile tightens limits and adds advice.
# These are conservative engineering defaults, not medical guidance - every
# profile-adjusted answer carries a "not medical advice" note.

profiles:
  # An injury is different from the other profiles: the limit tightening is
  # secondary. What matters is that the answer says plainly that the
  # activity is not advisable right now and offers a gentler alternative.
  injury:
    label: "recent injury or recovery"
    pm25_limit: 60
    temp_limit_c: 32
    exposure_weight: 1.3
    air_weight: 1.3
    min_duration_min: 20
    limit_activity: true
    advice:
      - "With a recent fracture or injury, cycling is not advisable. Please follow your doctor's advice and do not push through pain."
      - "A short, flat walk is a much better option than cycling until you are cleared."
      - "Take only the route you know, avoid uneven ground, and stop if there is any pain."
      - "If you do cycle, keep it short, flat and at a pace you could hold without limping."

  asthma:
    label: "asthma / breathing sensitivity"
    pm25_limit: 60          # hard disqualifier above this (ug/m3)
    o3_limit: 100
    temp_limit_c: 33
    exposure_weight: 1.6    # downwind exposure counts more
    air_weight: 1.8
    uv_limit: 8
    min_duration_min: 30
    advice:
      - "Carry your inhaler and use it as prescribed before heading out."
      - "Check the live PM2.5 reading for this hour before you leave."
      - "Prefer a green, open-air spot away from traffic; avoid busy junctions."
      - "If you feel tightness, wheezing or breathlessness, stop and rest indoors."

  senior:
    label: "older adult"
    pm25_limit: 60
    temp_limit_c: 34
    exposure_weight: 1.2
    air_weight: 1.3
    min_duration_min: 30
    advice:
      - "Keep the walk short and plan a shaded or indoor break."
      - "Carry water; avoid the hottest part of the day."
      - "Stay on well-lit paths and avoid isolated stretches after dark."

  child:
    label: "child"
    pm25_limit: 60
    o3_limit: 100
    temp_limit_c: 34
    uv_limit: 8
    exposure_weight: 1.3
    air_weight: 1.4
    min_duration_min: 45
    advice:
      - "Bring water and snacks; schedule a shaded break."
      - "Apply sunscreen and check the UV index for this hour."
      - "Stay close to amenities and toilets; avoid isolated edges."

  pregnancy:
    label: "pregnancy"
    pm25_limit: 50
    temp_limit_c: 33
    exposure_weight: 1.4
    air_weight: 1.5
    min_duration_min: 30
    advice:
      - "Choose shaded or air-conditioned resting options nearby."
      - "Carry water and take frequent breaks."
      - "Avoid heat, crowds and long walks on hot afternoons."

# Free-text the user might use -> canonical profile name
aliases:
  asthma: [asthma, asthmatic, mild asthma, breathing, allergy, allergic, copd, bronchitis]
  senior: [senior, senior citizen, elderly, old, aged, parents, grandparent, grandfather, grandmother, grandpa, grandma]
  child: [child, children, kid, kids, kid's, children's, son, daughter, school boy, school girl, toddler]
  pregnancy: [pregnancy, pregnant, expectant, expecting, prenatal, antenatal]
